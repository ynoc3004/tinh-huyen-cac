<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1210"><title>Kỳ phổ · Tĩnh Huyền Quán</title>
<link rel="stylesheet" href="/fonts/fonts.css?v=appearance-1"><link rel="stylesheet" href="/fonts/titles.css?v=appearance-1"><link rel="stylesheet" href="/bi-canh.css?v=online-archive-1"><link rel="stylesheet" href="/review.css?v=1"><link rel="stylesheet" href="/history.css?v=1"><link rel="stylesheet" href="/tien-canh.css?v=appearance-2"><script src="/thien-co.js"></script><script src="/tien-canh.js?v=dao-lo-1"></script></head>
<body><div class="wrap"><main>
<header class="archive-heading"><h1>Kỳ phổ</h1><p>Kỳ phổ Chess.com, Lichess và các ván với bot.</p></header>
<div class="archive-toolbar"><div class="field"><label for="history-source">Nguồn kỳ phổ</label><select id="history-source"><option value="all">Tất cả nguồn</option><option value="chesscom">Chess.com</option><option value="lichess">Lichess</option><option value="bot">Ván với bot</option></select></div><div class="btns"><button type="button" class="act main" id="history-sync">Đồng bộ ván online</button><button type="button" class="act" id="history-refresh">Làm mới</button></div></div>
<div class="speed-filters" role="group" aria-label="Lọc theo tốc độ ván"><button type="button" data-speed="all" aria-pressed="true">Tất cả <span data-count="all">—</span></button><button type="button" data-speed="bullet" aria-pressed="false">Bullet <span data-count="bullet">—</span></button><button type="button" data-speed="blitz" aria-pressed="false">Blitz <span data-count="blitz">—</span></button><button type="button" data-speed="rapid" aria-pressed="false">Rapid <span data-count="rapid">—</span></button><button type="button" data-speed="other" aria-pressed="false">Khác / Không đồng hồ <span data-count="other">—</span></button></div>
<p id="history-accounts" class="meta"></p><p class="meta">Chess.com: hai tháng có kho ván gần nhất · Lichess: tối đa 100 ván gần nhất. Ván trùng được bỏ qua.</p><p id="history-sync-status" role="status" aria-live="polite"></p>
<p id="history-status" role="status" aria-live="polite"></p><div id="history-list" aria-busy="false"></div>
<div class="tech-pagination"><button type="button" class="act" id="history-prev" disabled>← Trước</button><span id="history-page"></span><button type="button" class="act" id="history-next" disabled>Sau →</button></div>
<section id="history-replay" class="archive-replay" hidden aria-label="Xem lại kỳ phổ">
<div><div class="frame"><div class="board-box" id="history-board"></div></div><div class="btns replay-controls"><button type="button" class="act" id="replay-start" aria-label="Về khai cuộc">|←</button><button type="button" class="act" id="replay-prev" aria-label="Nước trước">←</button><span id="history-position" aria-live="polite"></span><button type="button" class="act" id="replay-next" aria-label="Nước sau">→</button><button type="button" class="act" id="replay-end" aria-label="Đến nước cuối">→|</button><button type="button" class="act" id="replay-flip">Đảo bàn</button></div></div>
<div class="panel"><div class="replay-heading"><h2 id="history-title"></h2><button type="button" class="act" id="replay-close" aria-label="Đóng bàn xem lại">Đóng</button></div><p id="history-result"></p><div id="history-moves" class="history-moves"></div><button type="button" class="act main" id="history-download">Tải kỳ phổ PGN</button></div>
</section></main></div><script type="module" src="/history.js?v=1"></script></body></html>
