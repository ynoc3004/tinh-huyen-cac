<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đệ tử tạp dịch · Học cờ vua</title><link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/fonts/titles.css"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#0b1210;color:#e8efe9;font:16px/1.6 "Noto Serif",serif}main{max-width:1100px;margin:auto}a{color:#a9c990}h1,h2,h3{font-family:Charm,serif;font-weight:400}h1{font-size:2.6rem;margin:.5rem 0}button{font:inherit;cursor:pointer;color:inherit;background:#1b3027;border:1px solid #547865;border-radius:10px;padding:10px 16px;min-height:44px}button:hover{background:#294436}button:focus-visible,a:focus-visible{outline:3px solid #d2b97f;outline-offset:3px}[hidden]{display:none!important}.layout{display:grid;grid-template-columns:230px 1fr;gap:28px}.sidebar,.panel{padding:20px;border:1px solid #35483c;border-radius:16px;background:#121c19}.sidebar{align-self:start}.sidebar p{color:#aab9af}progress{width:100%;accent-color:#a9c990}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lesson{display:flex;align-items:center;gap:14px;text-align:left;background:#15221c;width:100%}.lesson .icon{font-size:2rem;color:#a9c990}.lesson strong{display:block}.lesson small{color:#d2b97f}.lesson.done{border-color:#a9c990}.practice{display:grid;grid-template-columns:minmax(0,520px) 1fr;gap:24px;margin-top:20px}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:6px solid #547865;border-radius:8px;overflow:hidden}.square{position:relative;border:0;border-radius:0;padding:0;min-height:0;background:#bed0b9;aspect-ratio:1;color:#111;font-size:clamp(24px,5vw,48px);font-family:"Segoe UI Symbol",sans-serif}.square.dark{background:#617e6c}.square:hover{background:#c8c382}.square.selected{box-shadow:inset 0 0 0 4px #d2b97f}.square.target:after{content:"";position:absolute;inset:37%;border-radius:50%;background:#1d3a2780;pointer-events:none}.square small{position:absolute;left:3px;bottom:0;font:10px sans-serif;color:#20372a}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}#feedback{min-height:3rem;color:#d2b97f}#task{padding:12px;border-left:3px solid #a9c990;background:#1a2921}.hint{color:#aab9af}.completed{color:#a9c990}@media(max-width:760px){.layout,.practice{grid-template-columns:1fr}.sidebar{padding:14px}.cards{grid-template-columns:1fr}body{padding:16px}}
</style><main><a href="/bi-canh.html#tech">← Công pháp các</a><h1>Đệ tử tạp dịch</h1><p>Học cờ vua bằng thực hành. Đọc bài, chọn quân rồi chọn ô đến.</p><div id="catalog" class="layout"><aside class="sidebar"><h2>Nhập môn kỳ đạo</h2><p id="progress-text"></p><progress id="progress" max="12"></progress><p>Tiến trình lưu trên trình duyệt này.</p><button id="reset">Đặt lại tiến trình</button><div id="reset-confirm" hidden><p>Xóa tiến trình 12 bài?</p><button id="confirm-reset">Xóa</button> <button id="cancel-reset">Hủy</button></div></aside><div id="lesson-list"></div></div><section id="practice" hidden><button id="back">← Danh sách bài</button><div class="practice"><div><div id="board" class="board" role="group" aria-label="Bàn cờ thực hành"></div><p class="hint">Trắng ở phía dưới · bấm quân rồi bấm ô đến.</p></div><div class="panel"><h2 id="lesson-title"></h2><p id="theory"></p><p id="task"></p><p id="feedback" role="status" aria-live="polite"></p><div class="actions"><button id="retry">Làm lại</button><button id="hint">Gợi ý</button><button id="next" hidden>Bài tiếp theo →</button></div></div></div></section></main><script type="module">
import {Chess} from "/vendor/chess.js";
const LESSONS=[{"id":"rook","title":"Quân xe","icon":"♖","group":"Các quân cờ","text":"Xe đi ngang hoặc dọc, không nhảy qua quân khác.","fen":"7k/8/8/8/3R4/8/8/K7 w - - 0 1","task":"Đưa xe từ d4 tới d7.","answer":"d4d7"},{"id":"bishop","title":"Quân tượng","icon":"♗","group":"Các quân cờ","text":"Tượng đi chéo và luôn ở trên cùng màu ô.","fen":"7k/8/8/8/3B4/8/8/K7 w - - 0 1","task":"Đưa tượng từ d4 tới g7.","answer":"d4g7"},{"id":"queen","title":"Quân hậu","icon":"♕","group":"Các quân cờ","text":"Hậu kết hợp cách đi của xe và tượng: ngang, dọc hoặc chéo.","fen":"7k/8/8/8/3Q4/8/8/K7 w - - 0 1","task":"Đưa hậu từ d4 tới a7.","answer":"d4a7"},{"id":"king","title":"Quân vua","icon":"♔","group":"Các quân cờ","text":"Vua đi một ô mọi hướng, nhưng không được đi vào ô bị đối phương tấn công.","fen":"7k/8/8/8/3K4/8/8/8 w - - 0 1","task":"Đưa vua từ d4 tới e5.","answer":"d4e5"},{"id":"knight","title":"Quân mã","icon":"♘","group":"Các quân cờ","text":"Mã đi hình chữ L: hai ô theo một hướng rồi một ô vuông góc. Mã có thể nhảy qua quân.","fen":"7k/8/8/8/3N4/8/8/K7 w - - 0 1","task":"Đưa mã từ d4 tới f5.","answer":"d4f5"},{"id":"pawn","title":"Quân tốt","icon":"♙","group":"Các quân cờ","text":"Tốt đi thẳng một ô. Từ vị trí ban đầu, tốt có thể đi hai ô nếu đường trống. Tốt ăn chéo một ô.","fen":"7k/8/8/8/8/8/4P3/K7 w - - 0 1","task":"Đưa tốt từ e2 tới e4.","answer":"e2e4"},{"id":"capture","title":"Ăn quân","icon":"⚔","group":"Nguyên tắc cơ bản","text":"Đưa quân tới ô có quân đối phương để ăn nó. Không thể ăn quân cùng màu.","fen":"7k/8/3n4/8/3R4/8/8/K7 w - - 0 1","task":"Dùng xe d4 ăn mã d6.","answer":"d4d6"},{"id":"check","title":"Chiếu trong một nước","icon":"♜","group":"Nguyên tắc cơ bản","text":"Chiếu là tấn công vua đối phương. Bên bị chiếu phải xử lý ngay ở nước tiếp theo.","fen":"7k/8/8/8/3R4/8/8/K7 w - - 0 1","task":"Đưa xe từ d4 tới d8 để chiếu vua h8.","answer":"d4d8"},{"id":"escape","title":"Thoát chiếu","icon":"♔","group":"Nguyên tắc cơ bản","text":"Có ba cách thoát chiếu: chạy vua, ăn quân chiếu hoặc chặn đường chiếu. Mã chiếu thì không thể chặn.","fen":"7k/8/8/8/8/8/8/r3K3 w - - 0 1","task":"Vua e1 đang bị xe a1 chiếu. Chạy tới e2.","answer":"e1e2"},{"id":"mate","title":"Chiếu hết trong một nước","icon":"♛","group":"Nguyên tắc cơ bản","text":"Chiếu hết xảy ra khi vua bị chiếu và không còn nước hợp lệ nào để thoát.","fen":"7k/5K2/6Q1/8/8/8/8/8 w - - 0 1","task":"Đưa hậu g6 tới g7 để chiếu hết.","answer":"g6g7"},{"id":"castle","title":"Nhập thành","icon":"♖","group":"Luật đặc biệt","text":"Vua và xe chưa đi, đường giữa trống, vua không bị chiếu và không đi qua ô bị tấn công. Nhập thành cánh vua: vua e1 tới g1, xe h1 tới f1.","fen":"4k3/8/8/8/8/8/8/4K2R w K - 0 1","task":"Bấm vua e1 rồi ô g1 để nhập thành.","answer":"e1g1"},{"id":"promotion","title":"Phong cấp","icon":"♕","group":"Luật đặc biệt","text":"Khi tới hàng cuối, tốt phải đổi thành hậu, xe, tượng hoặc mã. Bài này tự chọn hậu.","fen":"7k/4P3/8/8/8/8/8/K7 w - - 0 1","task":"Đưa tốt e7 tới e8 để phong hậu.","answer":"e7e8q"}];
const $=id=>document.getElementById(id), KEY="tinhhuyen.lessons.v1";
let completed=new Set();try{const a=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(a))completed=new Set(a.filter(id=>LESSONS.some(l=>l.id===id)));}catch{}
let current=0,chess,selected=null,solved=false;
function catalog(){const groups=[...new Set(LESSONS.map(l=>l.group))];$("lesson-list").innerHTML=groups.map(g=>'<h2>'+g+'</h2><div class="cards">'+LESSONS.filter(l=>l.group===g).map(l=>'<button class="lesson '+(completed.has(l.id)?'done':'')+'" data-id="'+l.id+'"><span class="icon" aria-hidden="true">'+l.icon+'</span><span><strong>'+l.title+'</strong><small>'+(completed.has(l.id)?'★ Đã hoàn thành':'Thực hành trên bàn cờ')+'</small></span></button>').join("")+'</div>').join("");$("progress").value=completed.size;$("progress-text").textContent=completed.size+"/12 bài · "+Math.round(completed.size/12*100)+"%";}
function open(i){current=i;const l=LESSONS[i];chess=new Chess(l.fen);selected=null;solved=false;$("catalog").hidden=true;$("practice").hidden=false;$("lesson-title").textContent=l.icon+" "+l.title;$("theory").textContent=l.text;$("task").textContent=l.task;$("feedback").textContent="Bạn cầm quân Trắng.";$("next").hidden=true;draw();}
const glyph={wk:"♔",wq:"♕",wr:"♖",wb:"♗",wn:"♘",wp:"♙",bk:"♚",bq:"♛",br:"♜",bb:"♝",bn:"♞",bp:"♟"};
function draw(){const targets=selected?chess.moves({square:selected,verbose:true}).map(m=>m.to):[];let out="";for(let rank=8;rank>=1;rank--)for(let file=0;file<8;file++){const sq="abcdefgh"[file]+rank,p=chess.get(sq);out+='<button type="button" class="square '+((file+rank)%2?'':'dark')+(sq===selected?' selected':'')+(targets.includes(sq)?' target':'')+'" data-sq="'+sq+'" aria-label="'+sq+(p?' '+(p.color==='w'?'Trắng ':'Đen ')+({k:'vua',q:'hậu',r:'xe',b:'tượng',n:'mã',p:'tốt'}[p.type]):' ô trống')+'">'+(p?glyph[p.color+p.type]:'')+'<small>'+sq+'</small></button>';} $("board").innerHTML=out;}
$("board").onclick=e=>{const b=e.target.closest("[data-sq]");if(!b||solved)return;const sq=b.dataset.sq,p=chess.get(sq);if(p&&p.color==='w'){selected=sq;draw();return;}if(!selected){$("feedback").textContent="Chọn một quân Trắng trước.";return;}const answer=LESSONS[current].answer;let move;try{move=chess.move({from:selected,to:sq,promotion:'q'});}catch{$("feedback").textContent="Nước này không hợp lệ. Xem các ô đánh dấu.";return;}if(move.from+move.to+(move.promotion||"")!==answer){chess.undo();$("feedback").textContent="Nước đi hợp lệ, nhưng chưa đúng nhiệm vụ. Thử lại nhé.";draw();return;}solved=true;selected=null;completed.add(LESSONS[current].id);try{localStorage.setItem(KEY,JSON.stringify([...completed]));}catch{}$("feedback").textContent=chess.isCheckmate()?"Đúng rồi! Chiếu hết. Đã hoàn thành bài.":"Đúng rồi! Đã hoàn thành bài.";$("next").hidden=false;$("next").textContent=current===LESSONS.length-1?"Về danh sách ✓":"Bài tiếp theo →";draw();};
$("lesson-list").onclick=e=>{const b=e.target.closest("[data-id]");if(b)open(LESSONS.findIndex(l=>l.id===b.dataset.id));};
$("retry").onclick=()=>open(current);$("hint").onclick=()=>{$("feedback").textContent="Chọn quân ở "+LESSONS[current].answer.slice(0,2)+", rồi đi tới "+LESSONS[current].answer.slice(2,4)+".";};
function back(){$("practice").hidden=true;$("catalog").hidden=false;catalog();}
$("back").onclick=back;$("next").onclick=()=>current<LESSONS.length-1?open(current+1):back();
$("reset").onclick=()=>{$("reset-confirm").hidden=false;};$("cancel-reset").onclick=()=>{$("reset-confirm").hidden=true;};$("confirm-reset").onclick=()=>{completed.clear();try{localStorage.removeItem(KEY);}catch{}$("reset-confirm").hidden=true;catalog();};catalog();
</script></html>
