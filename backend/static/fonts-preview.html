<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1210"><title>Pháp tự · Tĩnh Huyền Các</title>
<link rel="stylesheet" href="/fonts/fonts.css?v=appearance-1"><link rel="stylesheet" href="/fonts/titles.css?v=appearance-1">
<style>
*{box-sizing:border-box}body{margin:0 auto;max-width:70rem;padding:2rem 1.5rem;font:16px/1.7 var(--font-body)}.hero{position:relative;padding:1rem 5rem 1.7rem 0;border-bottom:1px solid var(--line)}.eyebrow{color:var(--gold);font-size:.75rem;letter-spacing:.15em}.hero h1{font:400 clamp(2.4rem,6vw,3.4rem)/1.25 var(--title);margin:.7rem 0;color:var(--gold)}.hero p{max-width:44rem;color:var(--muted)}.seal{position:absolute;right:0;top:1.8rem;background:var(--seal);color:var(--seal-ink);padding:.5rem .7rem;border:3px double var(--seal-ink);border-radius:4px;line-height:1.2;font-size:1.1rem;transform:rotate(-4deg)}.font-tools{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;margin:1.5rem 0}.font-tools button{font:inherit;color:var(--jade);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:.55rem 1rem;cursor:pointer;min-height:44px}#msg{font-size:.82rem;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:1rem}.c{appearance:none;cursor:pointer;display:flex;flex-direction:column;gap:.6rem;text-align:left;width:100%;border:1px solid var(--line);padding:1.2rem;color:var(--ink);transition:border-color .2s,transform .2s}.c:hover{border-color:var(--gold);transform:translateY(-2px)}.n{font-size:.75rem;color:var(--muted)}.big{font:400 2rem/1.25 var(--ff)}.mid{font:400 1.2rem/1.6 var(--ff);color:var(--jade)}.sm{font:400 .95rem/1.75 var(--ff)}.chosen{font-size:.7rem;color:var(--gold);opacity:0}.c.on .chosen{opacity:1}@media(max-width:720px){body{padding:1rem}.hero{padding-right:3.5rem}.seal{font-size:1.2rem}.grid{gap:.8rem}}@media(prefers-reduced-motion:reduce){.c{transition:none}}
</style><link rel="stylesheet" href="/tien-canh.css?v=appearance-1"><script src="/thien-co.js"></script><script src="/tien-canh.js?v=appearance-1"></script></head>
<body><main><header class="hero"><span class="eyebrow">TĨNH HUYỀN CÁC · PHÁP TỰ</span><h1>Một nét chữ, một tâm cảnh</h1><p>Chọn font cho toàn bộ hệ thống: tiêu đề, nội dung, menu và các nút. Các trang và tab đang mở sẽ đổi ngay; lựa chọn được nhớ trên trình duyệt này.</p><span class="seal" aria-hidden="true">Pháp<br>Tự</span></header>
<div class="font-tools"><button id="reset">Dùng lại mặc định</button><span id="msg" role="status">Mặc định: Charm cho tiêu đề, Noto Serif cho nội dung.</span></div><div class="grid" id="font-grid" aria-label="Các mẫu font"></div></main>
<script>
const appearance=window.THCAppearance,grid=document.getElementById('font-grid'),msg=document.getElementById('msg');
for(const font of appearance.fonts){
 const card=document.createElement('button');card.type='button';card.className='c';card.dataset.fontId=font.id;card.setAttribute('aria-label','Chọn '+font.name);card.style.setProperty('--ff',font.family||font.title);
 card.innerHTML='<span class="n"></span><span class="big" data-font-sample>Tĩnh Huyền Các</span><span class="mid" data-font-sample>Luyện Khí tầng ba, Trúc Cơ viên mãn</span><span class="sm" data-font-sample>Sư phụ ơi, đệ tử xin thỉnh giáo nước cờ này.</span><span class="chosen">✦ Đang sử dụng</span>';
 card.querySelector('.n').textContent=font.name;
 if(font.id==='default')card.querySelector('.sm').style.fontFamily=font.body;
 card.onclick=()=>{const saved=appearance.setFont(font.id);msg.textContent=saved?'Đã áp dụng '+font.name+' cho toàn bộ hệ thống.':'Đã đổi font trong trang này; trình duyệt không cho lưu lựa chọn.';};grid.append(card);
}
document.getElementById('reset').onclick=()=>{const saved=appearance.setFont('default');msg.textContent=saved?'Đã dùng lại Charm cho tiêu đề và Noto Serif cho nội dung ở mọi trang.':'Đã dùng lại mặc định trong trang này; trình duyệt không cho lưu lựa chọn.';};
const mark=()=>{document.querySelectorAll('[data-font-id]').forEach(card=>{const on=card.dataset.fontId===appearance.getFont();card.classList.toggle('on',on);card.setAttribute('aria-pressed',String(on));});};
window.addEventListener('thc:appearance',mark);mark();
</script></body></html>
