<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Font tiêu đề · Tĩnh Huyền Các</title>
<link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/fonts/titles.css"><style>
:root{--paper:#e4ebe6;--ink:#1f2b2a;--seal:#a8322a;--mist:#c3d0c8}
@media(prefers-color-scheme:dark){:root{--paper:#1c2625;--ink:#dfe8e2;--mist:#33443f}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Noto Serif","Times New Roman",serif;padding:2rem 1.5rem;max-width:60rem;margin-inline:auto}
a{color:var(--ink)}h1{font-weight:400}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:1rem;margin-top:1rem}
.c{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:.3rem;border:1px solid var(--mist);padding:1rem;box-sizing:border-box}
.c:focus-visible{outline:3px solid var(--ink)}.c.on{border:2px solid var(--seal)}.n{font-size:.85rem;opacity:.7}
.big{font:2.2rem/1.2 var(--ff)}.mid{font:1.4rem/1.3 var(--ff)}.sm{font:1rem/1.5 var(--ff)}
button.r{font:inherit;color:inherit;background:none;border:1px solid var(--ink);padding:.4em 1em;cursor:pointer}
</style></head><body><a href="/">← Tĩnh Huyền Các</a><h1>Chọn font tiêu đề</h1>
<p>Bấm vào một kiểu để áp dụng cho tiêu đề ở mọi trang (chữ thường vẫn giữ Noto Serif). Lựa chọn được nhớ trên trình duyệt này.</p>
<p><button class="r" id="reset">Dùng lại mặc định</button> <span id="msg" role="status"></span></p><div class="grid"><button class="c" data-f="'Philosopher',serif" style="--ff:'Philosopher',serif"><span class="n">Philosopher</span><span class="big">Tĩnh Huyền Các</span><span class="mid">Luyện Khí tầng ba, Trúc Cơ viên mãn</span><span class="sm">Sư phụ ơi, đệ tử xin thỉnh giáo nước cờ này.</span></button><button class="c" data-f="'Cormorant Garamond',serif" style="--ff:'Cormorant Garamond',serif"><span class="n">Cormorant Garamond</span><span class="big">Tĩnh Huyền Các</span><span class="mid">Luyện Khí tầng ba, Trúc Cơ viên mãn</span><span class="sm">Sư phụ ơi, đệ tử xin thỉnh giáo nước cờ này.</span></button><button class="c" data-f="'Yeseva One',serif" style="--ff:'Yeseva One',serif"><span class="n">Yeseva One</span><span class="big">Tĩnh Huyền Các</span><span class="mid">Luyện Khí tầng ba, Trúc Cơ viên mãn</span><span class="sm">Sư phụ ơi, đệ tử xin thỉnh giáo nước cờ này.</span></button><button class="c" data-f="'Dancing Script',cursive" style="--ff:'Dancing Script',cursive"><span class="n">Dancing Script</span><span class="big">Tĩnh Huyền Các</span><span class="mid">Luyện Khí tầng ba, Trúc Cơ viên mãn</span><span class="sm">Sư phụ ơi, đệ tử xin thỉnh giáo nước cờ này.</span></button><button class="c" data-f="'Charm',cursive" style="--ff:'Charm',cursive"><span class="n">Charm</span><span class="big">Tĩnh Huyền Các</span><span class="mid">Luyện Khí tầng ba, Trúc Cơ viên mãn</span><span class="sm">Sư phụ ơi, đệ tử xin thỉnh giáo nước cờ này.</span></button><button class="c" data-f="'Sriracha',cursive" style="--ff:'Sriracha',cursive"><span class="n">Sriracha</span><span class="big">Tĩnh Huyền Các</span><span class="mid">Luyện Khí tầng ba, Trúc Cơ viên mãn</span><span class="sm">Sư phụ ơi, đệ tử xin thỉnh giáo nước cờ này.</span></button><button class="c" data-f="'Playfair Display',serif" style="--ff:'Playfair Display',serif"><span class="n">Playfair Display</span><span class="big">Tĩnh Huyền Các</span><span class="mid">Luyện Khí tầng ba, Trúc Cơ viên mãn</span><span class="sm">Sư phụ ơi, đệ tử xin thỉnh giáo nước cờ này.</span></button></div>
<script>
const cs=[...document.querySelectorAll('.c')],cur=(()=>{try{return localStorage.getItem('titleFont')}catch(e){return null}})();
const mark=f=>cs.forEach(c=>c.classList.toggle('on',c.dataset.f===f));mark(cur);
cs.forEach(c=>c.onclick=()=>{try{localStorage.setItem('titleFont',c.dataset.f);mark(c.dataset.f);document.getElementById('msg').textContent='Đã chọn. Mở lại các trang khác để thấy.'}catch(e){document.getElementById('msg').textContent='Trình duyệt không cho lưu lựa chọn.'}});
document.getElementById('reset').onclick=()=>{try{localStorage.removeItem('titleFont')}catch(e){};mark(null);document.getElementById('msg').textContent='Đã về mặc định.'};
</script></body></html>
